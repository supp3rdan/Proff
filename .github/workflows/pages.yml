# Publica a pasta public/ no GitHub Pages a cada push na main.
# Em Settings → Pages, a origem (Source) deve ser "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # As chaves ficam nos segredos do repositório, nunca no código.
      - name: Gerar config.js com as chaves padrão
        run: node scripts/gerar-config.js
        env:
          # Aceita os nomes padrão e os que já estão cadastrados no repositório.
          # Se uma chave estiver no nome errado, gerar-config.js a reconhece
          # pelo começo (AIza/AQ. = Gemini, gsk_ = Groq, sk-or- = OpenRouter).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROK_API_SECRET_TRUE || secrets.GROQ_API_SECRET_TRUE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.API_KEY_GROQ }}
      # Versão nos endereços dos arquivos (app.js?v=abc1234): cada publicação
      # obriga o navegador a baixar os arquivos novos em vez de usar o cache.
      - name: Marcar versão nos arquivos
        run: |
          VERSAO="${GITHUB_SHA::7}"
          grep -rl "__VERSAO__" public | xargs sed -i "s/__VERSAO__/${VERSAO}/g"
          echo "Versão publicada: ${VERSAO}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
